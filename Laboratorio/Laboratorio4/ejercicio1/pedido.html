<!DOCTYPE html>
<!-- SIS-256 - Laboratorio 4 - Ejercicio 1 - Integrantes: Carla Quispe y (nombre del compañero/a) -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arma tu pedido - Cafetería USFX</title>
    <link rel="stylesheet" href="../estilos.css">
    <script src="pedido.js" defer></script>
</head>
<body>
    <header class="cabecera">
        <div>
            <h1>Cafetería USFX</h1>
            <p>Arma tu pedido · Ejercicio 1 (JavaScript y DOM)</p>
        </div>
        <div>Productos en el pedido <span class="contador" id="contador">0</span></div>
    </header>

    <main class="contenedor">
        <div class="columnas">

            <!-- Columna izquierda: catálogo -->
            <section class="panel">
                <h2>Menú del día</h2>
                <div class="barra">
                    <div class="campo">
                        <label for="buscar">Buscar producto</label>
                        <input type="search" id="buscar" placeholder="Escriba parte del nombre...">
                    </div>
                    <div class="campo">
                        <label for="categoria">Categoría</label>
                        <select id="categoria">
                            <option value="Todas">Todas</option>
                            <option value="Salados">Salados</option>
                            <option value="Platos">Platos</option>
                            <option value="Postres">Postres</option>
                        </select>
                    </div>
                </div>
                <p class="vacio" id="resumen"></p>
                <div class="grilla" id="catalogo"></div>
            </section>

            <!-- Columna derecha: pedido y formulario -->
            <aside>
                <div class="panel">
                    <h3>Tu pedido</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th class="num">Cant.</th>
                                <th class="num">Subtotal</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="detalle"></tbody>
                        <tfoot>
                            <tr>
                                <td colspan="2">TOTAL</td>
                                <td class="num" id="total">Bs 0.00</td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                    <p class="derecha">
                        <button type="button" class="boton boton-sec mini" id="btnVaciar">Vaciar pedido</button>
                    </p>
                </div>

                <div class="panel">
                    <h3>Datos para la entrega</h3>
                    <div id="errores"></div>
                    <form id="formPedido" novalidate>
                        <div class="campo">
                            <label for="nombre">Nombre completo</label>
                            <input type="text" id="nombre" name="nombre">
                            <div class="error-campo" id="errNombre"></div>
                        </div>
                        <div class="campo">
                            <label for="celular">Celular</label>
                            <input type="tel" id="celular" name="celular" placeholder="7XXXXXXX">
                            <div class="error-campo" id="errCelular"></div>
                        </div>
                        <div class="campo">
                            <label for="entrega">Entrega</label>
                            <select id="entrega" name="entrega">
                                <option value="Recoger en caja">Recoger en caja</option>
                                <option value="Llevar al aula">Llevar al aula</option>
                            </select>
                        </div>
                        <div class="campo oculto" id="campoAula">
                            <label for="aula">Aula (ej. A-12)</label>
                            <input type="text" id="aula" name="aula">
                            <div class="error-campo" id="errAula"></div>
                        </div>
                        <button type="submit" class="boton boton-ok">Confirmar pedido</button>
                    </form>
                </div>

                <div id="avisos"></div>
            </aside>

        </div>
    </main>

    <p class="pie">SIS-256 · Tecnología y Desarrollo Web · Laboratorio 4</p>
</body>
</html>
